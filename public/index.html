<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Felovia Gurme — Menü</title>
<meta name="theme-color" content="#343c17" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --olive-deep: #343c17;   /* page background */
    --olive: #4b5626;        /* panels, matches the print menu */
    --cream: #f2eedd;        /* primary text */
    --cream-soft: #c9c8ad;   /* secondary text */
    --gold: #cfa75e;         /* accent: prices, active states */
    --line: #64703a;         /* hairlines on olive */
    --display: "Cormorant Garamond", Georgia, serif;
    --body: "Karla", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  body {
    background: var(--olive-deep);
    color: var(--cream);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header with logo ---------- */
  header {
    text-align: center;
    padding: 2.5rem 1.25rem 1.75rem;
    background:
      radial-gradient(ellipse at top, rgba(207,167,94,0.12), transparent 60%),
      var(--olive-deep);
  }
  header .logo {
    width: 132px;
    height: 132px;
    border-radius: 50%;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
  }
  header h1 {
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(2rem, 8vw, 2.8rem);
    letter-spacing: 0.02em;
    margin-top: 1rem;
  }
  header .tagline {
    margin-top: 0.35rem;
    color: var(--cream-soft);
    font-size: 0.85rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  header .rule {
    width: 64px;
    height: 1px;
    background: var(--gold);
    margin: 1.1rem auto 0;
  }

  /* ---------- Sticky category nav ---------- */
  nav {
    position: sticky;
    top: 0;
    z-index: 10;
    background: color-mix(in srgb, var(--olive-deep) 90%, transparent);
    backdrop-filter: blur(8px);
    border-block: 1px solid var(--line);
    display: flex;
    gap: 0.25rem;
    overflow-x: auto;
    padding: 0.6rem 1rem;
    scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  nav a {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    text-decoration: none;
    color: var(--cream-soft);
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0 0.9rem;
    border-radius: 999px;
    transition: color 0.15s, background 0.15s;
  }
  nav a.active, nav a:hover {
    color: var(--olive-deep);
    background: var(--gold);
  }
  nav a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---------- Menu sections ---------- */
  main { max-width: 640px; margin: 0 auto; padding: 0 1.25rem 4rem; }
  section { padding-top: 2.5rem; scroll-margin-top: 4rem; }
  section h2 {
    font-family: var(--display);
    font-weight: 600;
    font-size: 1.7rem;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }
  section h2::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  section .cat-note {
    margin-top: 0.4rem;
    color: var(--gold);
    font-size: 0.8rem;
    letter-spacing: 0.05em;
  }

  .item {
    padding: 1.05rem 0.75rem;
    margin-inline: -0.75rem;
    border-radius: 10px;
    display: flex;
    gap: 0.9rem;
    align-items: center;
    transition: background-color 0.2s;
  }
  .item.item-highlight { animation: item-flash 1.6s ease-out; }
  @keyframes item-flash {
    0%, 12% { background-color: color-mix(in srgb, var(--gold) 32%, transparent); }
    100% { background-color: transparent; }
  }
  @media (prefers-reduced-motion: reduce) {
    .item.item-highlight { animation: none; background-color: color-mix(in srgb, var(--gold) 32%, transparent); }
  }
  .item + .item { border-top: 1px dashed var(--line); }
  .item .thumb {
    flex: 0 0 auto;
    width: clamp(110px, 34vw, 152px);
    aspect-ratio: 3 / 2;
    border-radius: 14px;
    object-fit: cover;
    background: var(--olive);
    border: 1px solid color-mix(in srgb, var(--gold) 40%, var(--line));
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .item .thumb.loaded { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .item .thumb { transition: none; opacity: 1; }
  }
  .item .content { flex: 1; min-width: 0; }
  .item .row { display: flex; align-items: baseline; gap: 0.5rem; }
  .item .name { font-weight: 700; font-size: 1rem; letter-spacing: 0.01em; }
  .item .leader {
    flex: 1;
    border-bottom: 2px dotted var(--line);
    transform: translateY(-4px);
  }
  .item .price {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--gold);
    white-space: nowrap;
  }
  .item .desc {
    margin-top: 0.3rem;
    color: var(--cream-soft);
    font-size: 0.87rem;
    line-height: 1.45;
    max-width: 52ch;
  }

  footer {
    text-align: center;
    color: var(--cream-soft);
    font-size: 0.78rem;
    letter-spacing: 0.05em;
    padding: 2rem 1rem 3rem;
    border-top: 1px solid var(--line);
  }
  footer .mark {
    font-family: var(--display);
    font-size: 1.1rem;
    color: var(--cream);
    margin-bottom: 0.3rem;
  }

  .status { text-align: center; color: var(--cream-soft); padding: 3rem 1rem; }

  /* ---------- Featured photo slider ---------- */
  .featured {
    margin-top: 1.5rem;
    padding: 0 1.25rem;
  }
  .featured-viewport {
    position: relative;
    max-width: 640px;
    margin: 0 auto;
  }
  .featured-track {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    border-radius: 18px;
  }
  .featured-track::-webkit-scrollbar { display: none; }
  .featured-slide {
    position: relative;
    flex: 0 0 100%;
    width: 100%;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    border-radius: 18px;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    cursor: pointer;
  }
  .featured-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .featured-slide:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; }
  .featured-slide .slide-label {
    position: absolute;
    inset: auto 0 0 0;
    padding: 2.5rem 1rem 0.8rem;
    background: linear-gradient(to top, rgba(0,0,0,0.72), transparent);
    pointer-events: none;
  }
  .featured-slide .slide-label span {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.2rem;
    color: var(--cream);
    letter-spacing: 0.01em;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  .featured-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.45);
    color: var(--cream);
    font-size: 1.4rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
  }
  .featured-arrow:hover { background: rgba(0,0,0,0.65); }
  .featured-arrow:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .featured-arrow-prev { left: 0.6rem; }
  .featured-arrow-next { right: 0.6rem; }
  .featured-dots {
    display: flex;
    justify-content: center;
    gap: 0.2rem;
    margin-top: 0.5rem;
  }
  .featured-dots button {
    width: 32px;
    height: 32px;
    padding: 0;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .featured-dots button::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--line);
    transition: background 0.15s, transform 0.15s;
  }
  .featured-dots button.active::before { background: var(--gold); transform: scale(1.3); }
  .featured-dots button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 50%; }
</style>
</head>

  const slug = (s) => s.toLowerCase()
    .replaceAll("ı","i").replaceAll("ş","s").replaceAll("ğ","g")
    .replaceAll("ü","u").replaceAll("ö","o").replaceAll("ç","c")
    .replace(/[^a-z0-9]+/g, "-");

  function render(data) {
    document.getElementById("restaurant-name").textContent = data.restaurant;
    document.getElementById("restaurant-tagline").textContent = data.tagline || "";
    document.title = data.restaurant + " — Menü";
    if (data.logo) document.getElementById("logo").src = data.logo;
    const cur = data.currency || "₺";

    const nav = document.getElementById("category-nav");
    const main = document.getElementById("menu");
    nav.innerHTML = "";
    main.innerHTML = "";

    for (const cat of data.categories) {
      const id = slug(cat.name);

      const link = document.createElement("a");
      link.href = "#" + id;
      link.textContent = cat.name;
      link.dataset.target = id;
      nav.appendChild(link);

      const section = document.createElement("section");
      section.id = id;
      const h2 = document.createElement("h2");
      h2.textContent = cat.name;
      section.appendChild(h2);
      if (cat.note) {
        const note = document.createElement("p");
        note.className = "cat-note";
        note.textContent = cat.note;
        section.appendChild(note);
      }

      for (const item of cat.items) {
        const div = document.createElement("div");
        div.className = "item";
        div.id = "item-" + id + "-" + slug(item.name);
        div.innerHTML =
          '<div class="content">' +
            '<div class="row">' +
              '<span class="name"></span>' +
              '<span class="leader"></span>' +
              '<span class="price"></span>' +
            "</div>" +
          "</div>";
        div.querySelector(".name").textContent = item.name;
        div.querySelector(".price").textContent = item.price + cur;
        if (item.desc) {
          const p = document.createElement("p");
          p.className = "desc";
          p.textContent = item.desc;
          div.querySelector(".content").appendChild(p);
        }
        if (item.image) {
          const img = document.createElement("img");
          img.className = "thumb";
          img.src = item.image;
          img.alt = item.name;
          img.loading = "lazy";
          img.decoding = "async";
          img.onerror = () => img.remove();
          img.onload = () => img.classList.add("loaded");
          div.prepend(img);
        }
        section.appendChild(div);
      }
      main.appendChild(section);
    }

    const links = [...nav.querySelectorAll("a")];
    const observer = new IntersectionObserver(
      (entries) => {
        for (const entry of entries) {
          if (entry.isIntersecting) {
            links.forEach((l) =>
              l.classList.toggle("active", l.dataset.target === entry.target.id)
            );
          }
        }
      },
      { rootMargin: "-35% 0px -60% 0px" }
    );
    main.querySelectorAll("section").forEach((s) => observer.observe(s));
  }

  async function load() {
    try {
      const res = await fetch("/api/menu");
      if (!res.ok) throw new Error("HTTP " + res.status);
      render(await res.json());
    } catch {
      render(window.__FALLBACK__ || { restaurant: "Felovia Gurme", categories: [] });
    }
  }
  load();

  const featuredTrack = document.getElementById("featured-track");
  const featuredDots = document.getElementById("featured-dots");
  const featuredPrev = document.getElementById("featured-prev");
  const featuredNext = document.getElementById("featured-next");
  if (featuredTrack && featuredDots) {
    const dots = [...featuredDots.children];
    const slides = [...featuredTrack.children];
    const io = new IntersectionObserver(
      (entries) => {
        for (const entry of entries) {
          if (entry.isIntersecting) {
            const i = slides.indexOf(entry.target);
            dots.forEach((d, di) => d.classList.toggle("active", di === i));
          }
        }
      },
      { root: featuredTrack, threshold: 0.6 }
    );
    slides.forEach((s) => io.observe(s));

    dots.forEach((dot, i) => {
      dot.addEventListener("click", () => {
        slides[i].scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
      });
    });
    const currentIndex = () =>
      Math.round(featuredTrack.scrollLeft / featuredTrack.clientWidth);
    featuredPrev?.addEventListener("click", () => {
      const i = Math.max(0, currentIndex() - 1);
      slides[i].scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
    });
    featuredNext?.addEventListener("click", () => {
      const i = Math.min(slides.length - 1, currentIndex() + 1);
      slides[i].scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
    });

    function goToMenuItem(id) {
      const target = document.getElementById(id);
      if (!target) return;
      target.scrollIntoView({ behavior: "smooth", block: "center" });
      target.classList.remove("item-highlight");
      void target.offsetWidth;
      target.classList.add("item-highlight");
    }
    document.addEventListener("animationend", (e) => {
      if (e.animationName === "item-flash") e.target.classList.remove("item-highlight");
    });
    slides.forEach((slide) => {
      const targetId = slide.dataset.target;
      if (!targetId) return;
      slide.addEventListener("click", () => goToMenuItem(targetId));
      slide.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          goToMenuItem(targetId);
        }
      });
    });
  }
</script>
</body>
</html>
